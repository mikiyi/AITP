[mypy]
python_version = 3.11
# Check as the win32 target: env_scope (winreg) and secret_store (ctypes.WinDLL /
# get_last_error) branch on sys.platform at runtime and are Windows-only APIs, which
# Linux CI reports as "module has no attribute". Pinning the platform keeps the local
# Windows run and the Linux CI run on identical semantics.
platform = win32
mypy_path = backend
files = backend/aitp, backend/scripts
strict = True
pretty = True
show_error_codes = True
warn_unreachable = True
exclude = (?x)(^\.venv/|^build/|^dist/|__pycache__)

[mypy-flask.*]
ignore_missing_imports = True

[mypy-waitress.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-markdown.*]
ignore_missing_imports = True
